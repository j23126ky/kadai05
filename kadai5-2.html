<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>演習課題5-2：外部APIの呼び出しテスト</title>
</head>
<body>
    <h1 id="msg">何かのAPI</h1>
    <form name="apiform"><p>
        何かのフォーム：<input type="text" name="form_data">
        <button type="button" id="btn1" onclick="some_api(this.form)">実行</button>
    </p></form>
    
    <div id="result"></div>
    <script>
        async function some_api(myForm) {
            // ここにコードを書く
            const name = myForm.form_data.value;
            const endpoint = `https://api.agify.io/?name=${encodeURIComponent(name)}`;

            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                if (data.age !== null) {
                    document.getElementById("result").innerHTML += 
                        `名前「${data.name}」の予測年齢は ${data.age} 歳です。<br />`;
                } else {
                    document.getElementById("result").innerHTML += 
                        `名前「${data.name}」の年齢予測データは見つかりませんでした。<br />`;
                }
            } catch (error) {
                document.getElementById("result").innerHTML += 
                    `エラーが発生しました：${error}<br />`;
            }
            document.apiform.reset();
        }
    </script>
</body>
</html>
